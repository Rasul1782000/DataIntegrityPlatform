<div class="auth-layout min-vh-100 d-flex align-items-center justify-content-center">
  <div class="auth-container col-lg-5 col-md-6">
    <div class="auth-card">
      <div class="auth-card-header">
        <h2>Sign In</h2>
        <p>Enter your credentials to access the Data Integrity & Security Monitoring Platform</p>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" class="form-control"
                 [(ngModel)]="username" required #username="ngModel">
          <div class="invalid-feedback" *ngIf="username?.errors?.['required']">
            Username is required
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control"
                 [(ngModel)]="password" required #password="ngModel">
          <div class="invalid-feedback" *ngIf="password?.errors?.['required']">
            Password is required
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="isSubmitting">
          <i class="fas fa-sign-in-alt me-2"></i>
          {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
        </button>

        <div class="alert alert-danger mt-3 mb-0" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="auth-footer mt-3">
          <a href="#" class="link-secondary">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>
</div>
